<!DOCTYPE html>
<html>
<head>
    <title>Tableau</title>
    <script src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>
</head>
<body>
    <a href="scratch.html">Go to Scratch Page</a>

    <h1>Tableau Dashboard</h1>

    <div id="tableauVizContainer" style="width:100%; height:1000px;"></div>

    <script>
        var containerDiv = document.getElementById("tableauVizContainer");

        var url = "https://public.tableau.com/views/ZPDXRSJS8?:showVizHome=no";

        var options = {
            hideTabs: true,
            width: containerDiv.offsetWidth,
            height: containerDiv.offsetWidth * 0.8,
        };

        new tableau.Viz(containerDiv, url, options);
    </script>
</body>
</html>
