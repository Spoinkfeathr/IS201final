  <h1>Tableau Dashboard</h1>

  
  <div id="tableauViz" style="width:100%; max-width:1600px; margin:auto;"></div>

  
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>

  <script>
    const container = document.getElementById("tableauViz");
    const url = "https://public.tableau.com/views/ShipmentDashboard_17631611894330/OVERVIEW";
    const options = {
      hideTabs: true,
      toolbar: "yes",
      width: container.offsetWidth,
      height: container.offsetWidth * 0.62
    };
    new tableau.Viz(container, url, options);
  </script>
